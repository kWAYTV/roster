[package]
name = "roster"
version = "0.8.0"
edition = "2021"
description = "Steam login switcher"
build = "build.rs"

[lib]
name = "roster_lib"
# Windows desktop only. Mobile crate types make rustc codegen this crate three times.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
crc32fast = "1.5"
arboard = "3"
winreg = "0.56"
ureq = "3"

[target.'cfg(windows)'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-global-shortcut = "2"

[profile.dev]
incremental = true
debug = "line-tables-only"

[profile.release]
# IO-bound helper: skip size/LTO opts that made `tauri build` ~10 minutes.
opt-level = 2
lto = false
codegen-units = 16
strip = true
